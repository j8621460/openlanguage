# Creates the release signing key ONCE. Run by hand (Actions → 🔑 Generate
# release keystore → Run workflow, type GENERATE), save the four secrets it
# gives you, then DELETE the artifact and this run: anyone with read access
# can download artifacts while they exist.
#
# This key signs every future release. Lose it and users must uninstall to
# update. Keep an offline backup of release.keystore.b64 and the password.
name: 🔑 Generate release keystore

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type GENERATE to confirm (creates a NEW key; do not rerun once you have one)'
        required: true

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 🛑 Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "GENERATE" ]; then
            echo "::error::Type exactly GENERATE to continue."; exit 1
          fi

      - name: 🔑 Create the keystore
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          umask 077
          # PKCS12 (the JDK default) ignores a separate -keypass, so one
          # password is used for both store and key.
          STORE_PASS=$(openssl rand -base64 32 | tr -d '/+=' | cut -c1-32)
          ALIAS="palabras-release"
          keytool -genkeypair -v \
            -keystore release.keystore -storetype PKCS12 \
            -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
            -dname "CN=Palabras, O=Palabras, C=ES" > /dev/null 2>&1
          base64 -w0 release.keystore > release.keystore.b64
          {
            echo "Save as Repository Secrets (Settings → Secrets and variables → Actions):"
            echo ""
            echo "RELEASE_KEYSTORE_BASE64 = contents of release.keystore.b64"
            echo "RELEASE_KEYSTORE_PASSWORD = $STORE_PASS"
            echo "RELEASE_KEY_ALIAS = $ALIAS"
            echo "RELEASE_KEY_PASSWORD = $STORE_PASS   (same as the store password)"
            echo ""
            keytool -list -v -keystore release.keystore -storepass "$STORE_PASS" | grep -E 'SHA1|SHA256'
          } > secrets-to-save.txt
          mkdir -p out && mv release.keystore.b64 secrets-to-save.txt out/
          rm -f release.keystore
          # The password is NOT printed to the log.

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: keystore-NEW-save-it-then-delete-this-artifact
          path: ${{ runner.temp }}/out/
          retention-days: 1

      - name: 📋 Next steps
        run: |
          echo "::notice::Download the artifact, create the 4 secrets from secrets-to-save.txt, then delete the artifact and this run."
