name: 📦 Build APK

# Runs on every push and PR, or by hand (Actions → 📦 Build APK → Run workflow).
# Always produces an installable DEBUG apk. If the four RELEASE_* secrets exist
# (see generate-keystore.yml), it also builds a signed, minified RELEASE apk.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: read-only token for every job.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  SDKVER: "36"
  BUILD_TOOLS: "36.0.0"

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # true/false only; the secret itself is never echoed.
      HAS_SIGNING: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Refuses to run if gradle/wrapper/gradle-wrapper.jar was tampered with.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: "17"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Only main writes the cache; PRs can't poison it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''

      - name: 🤖 Install Android SDK ${{ env.SDKVER }}
        run: |
          set -eu
          for i in 1 2 3; do
            sdkmanager --install "platforms;android-${SDKVER}" "build-tools;${BUILD_TOOLS}" > /dev/null && break
            echo "sdkmanager attempt $i failed, retrying"; sleep 15
          done
          test -x "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

      - name: 🧪 Unit tests
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew testDebugUnitTest --no-configuration-cache 2>&1 | tee /tmp/unit.log; then
            # Kotlin compile errors and failed tests as annotations on the run page.
            grep -E '^e: ' /tmp/unit.log | head -30 | while IFS= read -r line; do
              f=$(printf '%s' "$line" | sed -nE 's#^e: file://[^ ]*/(app/src/[^:]+):([0-9]+):([0-9]+) (.*)#\1#p')
              l=$(printf '%s' "$line" | sed -nE 's#^e: file://[^ ]*/(app/src/[^:]+):([0-9]+):([0-9]+) (.*)#\2#p')
              m=$(printf '%s' "$line" | sed -nE 's#^e: file://[^ ]*/(app/src/[^:]+):([0-9]+):([0-9]+) (.*)#\4#p')
              if [ -n "$f" ]; then echo "::error file=$f,line=$l::${m}"; else echo "::error::${line}"; fi
            done
            grep -E 'FAILED$|> Task .* FAILED|AAPT: error|error: resource' /tmp/unit.log | head -15 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi

      - name: 🔍 Android lint (report only)
        continue-on-error: true
        run: ./gradlew lintDebug --no-configuration-cache

      - name: 🏗️ Assemble debug APK
        run: ./gradlew assembleDebug --no-configuration-cache

      - name: 🔑 Decode release keystore
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -eu
          printf '%s' "$KS" | tr -d ' \r\n\t' | base64 -d > "${RUNNER_TEMP}/release.keystore"
          test -s "${RUNNER_TEMP}/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_ENV"

      - name: 🚂 Assemble signed release APK
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-configuration-cache

      - name: 🧹 Remove keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.keystore"

      - name: 🔎 Verify and name the APKs
        id: apks
        run: |
          set -eu
          BT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          mkdir -p dist
          check() { # $1 apk, $2 expected applicationId
            local appid sdk tsdk
            appid=$("$BT/aapt" dump badging "$1" | grep -oP "package: name='\K[^']+")
            sdk=$("$BT/aapt" dump badging "$1" | grep -oP "sdkVersion:'\K[0-9]+")
            tsdk=$("$BT/aapt" dump badging "$1" | grep -oP "targetSdkVersion:'\K[0-9]+")
            [ "$appid" = "$2" ] || { echo "::error::$1 has applicationId $appid, expected $2"; exit 1; }
            [ "$sdk" = "26" ] || { echo "::error::$1 minSdk is $sdk, expected 26 (Android 8)"; exit 1; }
            [ "$tsdk" = "${SDKVER}" ] || { echo "::error::$1 targetSdk is $tsdk, expected ${SDKVER}"; exit 1; }
            "$BT/apksigner" verify --min-sdk-version 26 "$1" > /dev/null || { echo "::error::$1 failed signature verification"; exit 1; }
          }
          dbg=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          check "$dbg" com.palabrasfuncionales.app.debug
          cp "$dbg" dist/Palabras-debug.apk
          rel=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' 2>/dev/null | head -1 || true)
          if [ -n "$rel" ]; then
            check "$rel" com.palabrasfuncionales.app
            if "$BT/aapt" dump badging "$rel" | grep -q "application-debuggable"; then
              echo "::error::release APK is debuggable"; exit 1
            fi
            cp "$rel" dist/Palabras-release.apk
            echo "Release signing certificate (use the SHA-1 to restrict your Google API key):" >> "$GITHUB_STEP_SUMMARY"
            "$BT/apksigner" verify --print-certs "$rel" | grep -E 'SHA-256|SHA-1' | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          fi
          (cd dist && sha256sum *.apk | tee SHA256SUMS.txt)
          { echo '### APKs'; echo '```'; cat dist/SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: palabras-apk-${{ github.run_number }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          retention-days: 14
          if-no-files-found: ignore
