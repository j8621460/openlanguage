name: 🚀 Signed release

# Push a tag like v1.2.3 (or run by hand with a tag) to build the signed APK
# and attach it to a GitHub Release. Fails instead of shipping unsigned if any
# RELEASE_* secret is missing. Never generate a new key once users have the
# app installed: Android refuses updates signed by a different key.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v1.0.0. Empty = newest v* tag.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag || 'auto' }}
  cancel-in-progress: false

env:
  SDKVER: "36"
  BUILD_TOOLS: "36.0.0"

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # only this job may create the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🏷️ Resolve tag and version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          tag="$INPUT_TAG"
          if [ -z "$tag" ] && [ "$REF_TYPE" = tag ]; then tag="$REF_NAME"; fi
          if [ -z "$tag" ]; then tag=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1); fi
          # Strict format: also blocks shell/expression injection through the tag name.
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$'; then
            echo "::error::Tag '$tag' must look like v1.2.3"; exit 1
          fi
          git rev-parse -q --verify "refs/tags/$tag" > /dev/null || { echo "::error::Tag $tag not found"; exit 1; }
          git checkout -q "$tag"
          IFS=. read -r ma mi pa <<< "${tag#v}"
          echo "VER=$tag" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${tag#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( ma * 1000000 + mi * 1000 + pa ))" >> "$GITHUB_ENV"

      - name: 🔎 Signing secrets present?
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -z "$KS_PASS" ] && missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "$KEY_PASS" ] && missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. Run '🔑 Generate release keystore' first."
            exit 1
          fi

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "17"
          distribution: temurin

      # No Gradle cache for releases: a poisoned cache can't reach a signed build.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-disabled: true

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: ''

      - name: 🤖 Install Android SDK ${{ env.SDKVER }}
        run: |
          set -eu
          for i in 1 2 3; do
            sdkmanager --install "platforms;android-${SDKVER}" "build-tools;${BUILD_TOOLS}" > /dev/null && break
            sleep 15
          done

      - name: 🔑 Decode keystore
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -eu
          printf '%s' "$KS" | tr -d ' \r\n\t' | base64 -d > "${RUNNER_TEMP}/release.keystore"
          test -s "${RUNNER_TEMP}/release.keystore" || { echo "::error::keystore decoded to nothing"; exit 1; }
          echo "RELEASE_KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_ENV"

      - name: 🧪 Validate keystore and passwords
        env:
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -u
          if ! out=$(keytool -list -keystore "$RELEASE_KEYSTORE_PATH" -storepass "$KS_PASS" 2>&1); then
            echo "::error::RELEASE_KEYSTORE_PASSWORD is wrong or the keystore is invalid"; exit 1
          fi
          aliases=$(echo "$out" | grep -E 'PrivateKeyEntry' | cut -d, -f1 | tr '\n' ' ')
          echo "$aliases" | tr ' ' '\n' | grep -qxF -- "$KEY_ALIAS" || { echo "::error::RELEASE_KEY_ALIAS not in keystore (found: ${aliases:-none})"; exit 1; }
          if echo "$out" | grep -qi 'Keystore type: PKCS12' && [ "$KEY_PASS" != "$KS_PASS" ]; then
            echo "::error::PKCS12 keystore: RELEASE_KEY_PASSWORD must equal RELEASE_KEYSTORE_PASSWORD"; exit 1
          fi

      - name: 🚂 Test and build release
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --no-configuration-cache --no-build-cache

      - name: 🧹 Remove keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.keystore"

      - name: 🔎 Verify APK
        run: |
          set -eu
          BT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          src=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)
          [ -n "$src" ] || { echo "::error::no signed release APK produced"; exit 1; }
          "$BT/apksigner" verify --min-sdk-version 26 "$src" > /dev/null
          appid=$("$BT/aapt" dump badging "$src" | grep -oP "package: name='\K[^']+")
          [ "$appid" = com.palabrasfuncionales.app ] || { echo "::error::wrong applicationId $appid"; exit 1; }
          if "$BT/aapt" dump badging "$src" | grep -q application-debuggable; then echo "::error::debuggable release"; exit 1; fi
          mkdir -p dist
          cp "$src" "dist/Palabras-${VER}.apk"
          cp "$src" dist/Palabras.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          "$BT/apksigner" verify --print-certs "$src" | grep -E 'SHA-256|SHA-1' > dist/signing-certificate.txt
          { echo "### $VER"; echo '```'; cat dist/SHA256SUMS.txt dist/signing-certificate.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: palabras-${{ env.VER }}
          path: dist/
          if-no-files-found: error

      # gh CLI (preinstalled) instead of a third-party release action.
      - name: 📦 Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          if ! gh release view "$VER" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$VER" --repo "$REPO" --title "Palabras $VER" --generate-notes --verify-tag
          fi
          gh release upload "$VER" dist/* --repo "$REPO" --clobber
